name: Project checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version-file: .java-version
      - name: Check for Android project
        id: android
        shell: bash
        run: |
          if test -f gradlew; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare Android SDK
        if: steps.android.outputs.present == 'true'
        uses: android-actions/setup-android@v3
      - name: Validate Gradle wrapper
        if: steps.android.outputs.present == 'true'
        uses: gradle/actions/wrapper-validation@v4
      - name: Run project checks
        run: bash scripts/check.sh
      - name: Upload debug APK
        if: success() && steps.android.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: smart-pantry-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload lint report
        if: always() && steps.android.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
      - name: Upload test report
        if: always() && steps.android.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: java-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
